<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Sistema de Agendamento</h1>
    <p id="mensagem"></p>

    <section>
      <h2>Entrar</h2>
      <form id="formLogin">
        <label>Email <input type="email" id="loginEmail"></label>
        <label>Senha <input type="password" id="loginSenha"></label>
        <button type="submit">Entrar</button>
      </form>
    </section>

    <section>
      <h2>Cadastrar</h2>
      <form id="formCadastro">
        <label>Nome <input type="text" id="cadNome"></label>
        <label>Email <input type="email" id="cadEmail"></label>
        <label>Senha <input type="password" id="cadSenha"></label>
        <button type="submit">Cadastrar</button>
      </form>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
